name: Deploy SiteGround

"on":
  # Cada push a main despliega automaticamente a STAGING.
  push:
    branches:
      - main

  # Ejecucion manual para desplegar PRODUCCION desde main.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Los deploys manuales solo se permiten si el workflow se lanza desde main.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')

    runs-on: ubuntu-latest

    # Push => staging
    # Manual => production
    environment:
      name: ${{ github.event_name == 'push' && 'staging' || 'production' }}

    # Evita dos despliegues simultaneos al mismo entorno.
    concurrency:
      group: siteground-${{ github.event_name == 'push' && 'staging' || 'production' }}
      cancel-in-progress: false

    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR }}

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
          persist-credentials: false

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION || '22' }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar proyecto
        run: pnpm run build

      - name: Verificar dist
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          echo "Contenido generado en dist/:"
          ls -la dist

      - name: Instalar cliente FTP
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Validar configuracion
        shell: bash
        run: |
          set -euo pipefail
          : "${FTP_HOST:?Falta el secret FTP_HOST}"
          : "${FTP_USERNAME:?Falta el secret FTP_USERNAME}"
          : "${FTP_PASSWORD:?Falta el secret FTP_PASSWORD}"
          : "${FTP_REMOTE_DIR:?Falta la variable FTP_REMOTE_DIR}"

      - name: Sincronizar dist con SiteGround por FTPES
        shell: bash
        run: |
          set -euo pipefail

          lftp <<EOF_LFTP
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30

          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes

          open -p "$FTP_PORT" -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_HOST"

          # El servidor queda como espejo de dist/:
          # sube nuevos, reemplaza modificados y elimina obsoletos.
          mirror --reverse --delete --verbose --parallel=4 --no-perms \
            "dist/" "$FTP_REMOTE_DIR"

          bye
          EOF_LFTP
