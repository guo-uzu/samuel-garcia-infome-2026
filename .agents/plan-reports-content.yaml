  - slug: espacios-publicos
    title: "Espacios públicos"
    order: 9
    image: 2
    imageAlt: "Samuel García juega fútbol con un niño frente al Nuevo Estadio Bicentenario."
    description: "Espacios públicos en Nuevo León: Parque del Agua, 650 canchas de fútbol y Estadio Bicentenario."
    body: |
      - **Nuevo Parque del Agua**
      - **650 nuevas canchas** de fútbol
      - Nuevo **Estadio Bicentenario**
      - Nuevo **Parque Niños Héroes**
      - Nuevos **Corredores Verdes**
      - Nuevos **Parques Lineales:** <Detail>Av. Constitución y Av. Morones Prieto</Detail>
      - **Nuevo Parque Fundidora**

frontmatter_template: |
  ---
  title: "<title>"
  order: <order>
  imageDesktop: "../../assets/desktop/carousel-1-<image>-desktop.webp"
  imageMobile: "../../assets/mobile/carousel-1-<image>-mobile.webp"
  imageAlt: "<imageAlt>"
  description: "<description>"
  ---

  <body>

ordered_steps:
  - "1. Confirm step 1 is done and `pnpm build` passes with the Seguridad pilot."
  - "2. Create the 9 MDX files with the template above. Seguridad may already exist from the pilot: keep it, do not duplicate it."
  - "3. pnpm build. Fix any schema, image-path or MDX syntax error (watch for `<small>` or `<Detail>` inside list items, and blank lines around <Callout> content)."
  - "4. Open each of the 9 pages in dist or the dev server and compare with the mockup: image pair, order of blocks, bold lead-ins, icons."
  - "5. Report any text that could not be read from the mockups."

acceptance_criteria:
  - id: "AC1"
    requirement: "Nine MDX files exist in src/content/reports, named by slug, each with the six required frontmatter fields."
  - id: "AC2"
    requirement: "Every page uses the correct desktop and mobile image pair per the `image` number."
  - id: "AC3"
    requirement: "Body text, bold lead-ins, two-line bullets, mid-subtitles, stats and the callout match this file."
  - id: "AC4"
    requirement: "Icons match the mapping: medal (Primer Lugar), police (policías), pointer (Divisiones), hands (pobreza)."
  - id: "AC5"
    requirement: "pnpm build passes and generates /economia, /medio-ambiente, /seguridad, /movilidad, /agua, /salud, /ayudamos, /capullos and /espacios-publicos."
  - id: "AC6"
    requirement: "No component, CSS or config file is changed in this step. Only MDX files are added."

open_questions:
  - "Footnote text such as '(INEGI, Encuesta Intercensal 2025).' was read from small mockup text. Verify against the original source."
  - "'order' values follow the home carousel order (Economía, Medio ambiente, Seguridad, Movilidad, Agua) then Salud, Ayudamos, Capullos, Espacios públicos. Change if another order is wanted."
  - "Descriptions and image alts are drafted from the mockups. Edit as needed."
