artifact_version: "1.0"

feature:
  name: "Reports content fill (step 2)"
  goal: "Pure data entry. Create the 9 MDX files in src/content/reports/ from the data below so every topic page is filled. No design decisions here."
  prerequisite: "Step 1 (.agents/plan-reports.yaml) is implemented: mdx integration, content.config.ts, [id].astro, components Stat, Callout, Detail, report CSS."
  location: "src/content/reports/<slug>.mdx"

how_to_use:
  - "One MDX file per entry under `pages`. File name = slug + '.mdx'."
  - "Frontmatter keys: title, order, imageDesktop, imageMobile, imageAlt, description."
  - "Image paths are relative to the MDX file: ../../assets/desktop/carousel-1-N-desktop.webp and ../../assets/mobile/carousel-1-N-mobile.webp"
  - "Body is copied verbatim from the `body` block of each entry. Do not restyle, reorder or rewrite."
  - "Components are NOT imported in MDX. They are passed by the page route."
  - "Text comes from the mockups. Typos fixed on purpose: 'Américan Latina' -> 'América Latina', 'a la Mujeres' -> 'a las Mujeres'."
  - "If a mockup footnote was hard to read, keep it as written here and flag it in the report."

syntax_reference:
  bullet: "- **Bold lead** rest of the sentence"
  bullet_two_lines: "- **Title** <Detail>Second line</Detail>"
  mid_subtitle: "## Text"
  stat: "<Stat icon=\"medal\">**Primer Lugar** en Confianza</Stat>"
  callout: "<Callout icon=\"hands\">…</Callout>"
  footnote: "<small>(INEGI, 2025).</small>"
  icons:
    medal: "Primer Lugar"
    police: "policías"
    pointer: "Divisiones (verify the SVG is the crosshair)"
    hands: "Reducción de la pobreza callout"

pages:
  - slug: economia
    title: "Economía"
    order: 1
    image: 1
    imageAlt: "Vista aérea de la aduana de Nuevo León con camiones cruzando."
    description: "Economía de Nuevo León: primer lugar en inversión extranjera, empleo manufacturero e ingresos por hogar."
    body: |
      ## La aduana **más rápida y segura de México**

      - **Primer Lugar en inversión extranjera** <Detail>136 billones de dólares</Detail>
      - **Primer Lugar en generación de empleo manufacturero**
      - **Primer Lugar en ingresos por hogar**
      - **Primer Lugar en empleo IMMEX** <Detail>407,906 empleados registrados</Detail>
      - **Primer lugar en formalidad laboral** <Detail>y la tasa más baja de informalidad <small>(INEGI, 2025).</small></Detail>

  - slug: medio-ambiente
    title: "Medio ambiente"
    order: 2
    image: 5
    imageAlt: "Samuel García retira basura junto a voluntarios cerca de una vía del Metro."
    description: "Medio ambiente en Nuevo León: más de un millón de árboles plantados, C5 Ambiental y red de monitoreo."
    body: |
      - Más de **1 millón de árboles** plantados
      - Más de **10,000 toneladas** de basura retiradas
      - **337 empresas** contaminantes suspendidas
      - Nuevo **C5 Ambiental**
      - Nueva **red de monitoreo** ambiental
      - Nuevo **Centro Estatal de Atención Animal**
      - **Primer lugar** en combate a incendios forestales

  - slug: seguridad
    title: "Seguridad"
    order: 3
    image: 6
    imageAlt: "Samuel García camina frente a un helicóptero Black Hawk de la Guardia Estatal."
    description: "Seguridad en Nuevo León: Nueva Fuerza Civil, nuevos Black Hawks y reducción de homicidios."
    body: |
      - **Nuevo Cuartel** General de la Nueva Fuerza Civil
      - **17 Nuevos** Destacamentos
      - **+1000 Nuevas** patrullas y **200 Nuevas** SUVs blindadas
      - **+100 Nuevas** Black Mambas y vehículos Rhino
      - **2 Nuevos** Black Hawks
      - **10 Nuevos** Helicópteros

      ## La Nueva Fuerza Civil, la mejor policía de México

      <Stat icon="medal">**Primer Lugar** en Confianza (INEGI, 2026)</Stat>
      <Stat icon="medal">**Primer Lugar** en Desempeño (INEGI, 2026)</Stat>
      <Stat icon="police">**+7700** policías</Stat>
      <Stat icon="pointer">**7 nuevas** Divisiones</Stat>

      - **Los mejores resultados** de seguridad de los últimos 30 años
      - Reducción de **-90% de homicidios** y delitos de alto impacto
