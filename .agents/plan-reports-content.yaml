    description: "Movilidad en Nuevo León: 4300 nuevos camiones, nuevas líneas del Metro y siete nuevas carreteras."
    body: |
      - **4300 nuevos camiones** <Detail>y transmetros ecológicos, climatizados, con cámaras y hechos en Nuevo León.</Detail>
      - **Nueva Línea 4, Línea 6 y Línea Aeropuerto** <Detail>el monorriel más largo de América Latina.</Detail>
      - **Reconstrucción de la Línea 2 del Metro.**
      - **22 nuevos trenes para la Línea 1.**
      - **7 nuevas carreteras** <Detail>y vamos por una más</Detail>
      - **Más de 400 nuevos parabuses**

  - slug: agua
    title: "Agua"
    order: 5
    image: 3
    imageAlt: "Samuel García estrecha la mano de un hombre mayor en una lancha frente a la presa."
    description: "Agua en Nuevo León: Nueva Presa León, Acueducto El Cuchillo II y primer lugar nacional en cobertura."
    body: |
      - **Nueva Presa León** <Detail>Con la cortina más larga de América Latina y capacidad de 8 presas la Boca</Detail>
      - **Nuevo Acueducto El Cuchillo II** <Detail>100 kilómetros construidos en tiempo récord</Detail>
      - **Nuevo Sistema de Modulación de Presiones**
      - **Nuevo Tanque Nueva Castilla** <Detail>Y vamos por tres nuevos tanques para fortalecer la distribución de agua en García</Detail>

      ## Superamos la crisis y hoy somos primer lugar nacional:

      <Stat icon="medal">**Primer Lugar** en Cobertura de Agua Potable. 97.9% de los hogares tienen conexión a agua potable. <small>(INEGI, Encuesta Intercensal 2025).</small></Stat>
