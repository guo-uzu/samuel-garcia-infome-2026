    description: "Apoyos en Nuevo León: ayuda a las mujeres, útiles escolares, escuelas de tiempo completo y estancias infantiles."
    body: |
      - Ayudamos a las **Mujeres** con $2,000 mensuales y transporte gratis.
      - **Ayudamos con útiles,** uniformes y calzado escolar gratuitos.
      - **1,497 escuelas** de Tiempo Completo y Jornada Ampliada.
      - Nuevos **Centros Comunitarios**
      - Apoyamos a **118 estancias infantiles**

      <Callout icon="hands">
      **Primer Lugar en Reducción de la Pobreza**

      776 mil personas salieron de la pobreza <small>(INEGI 2025).</small>
      </Callout>

  - slug: capullos
